# Likho gateway (local): one address for the web app and every API.
# Services run on the host during development, so upstreams point at host.docker.internal.
worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  access_log    off;
  client_max_body_size 1g;          # call recordings are uploaded through /media

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Resolve upstreams at request time so the gateway starts even when a service is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # likho-api (NestJS): GraphQL, REST, API docs
    location /graphql {
      set $api http://host.docker.internal:4000;
      proxy_pass $api;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location /api/ {
      set $api http://host.docker.internal:4000;
      proxy_pass $api;
    }
    # Live transcript lines (server-sent events): never buffer, keep the connection open.
    location /events/ {
      set $api http://host.docker.internal:4000;
      proxy_pass $api;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_set_header Connection '';
    }

    # likho-media (Go): uploads and audio streaming with range requests
    location /media/ {
      set $media http://host.docker.internal:4010;
      proxy_pass $media;
      proxy_request_buffering off;
      proxy_read_timeout 10m;
    }

    # Micro-frontends: /mfe/<name>/ is added per app in Wave 1.

    # The web shell (Vite dev server, with hot reload over WebSocket)
    location / {
      set $web http://host.docker.internal:5173;
      proxy_pass $web;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    error_page 502 503 504 = @down;
    location @down {
      default_type application/json;
      return 502 '{"error":{"code":"service_unavailable","message":"The service behind this path is not running."}}\n';
    }
  }
}
