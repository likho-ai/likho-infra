# Reusable: build the repository's Dockerfile and push it to GitHub Container Registry.
# A release builds it again with `version` (see release-please.yml).
# Tags: sha-<commit>, the branch (development, staging, main), latest from main only.
# Caller (after its ci job, on a push to development, staging or main):
#   publish:
#     needs: ci
#     if: github.event_name == 'push'
#     uses: likho-ai/likho-infra/.github/workflows/docker-publish.yml@main
#     permissions: { contents: read, packages: write }
name: docker-publish

on:
  workflow_call:
    inputs:
      context: { type: string, default: "." }
      image: { type: string, default: "" }   # default: ghcr.io/<owner>/<repo>
      file: { type: string, default: "" }    # default: <context>/Dockerfile
      suffix: { type: string, default: "" }  # added to every tag: "-cuda" gives latest-cuda, sha-…-cuda
      # A release (release-please.yml): also tag the image 1.2.3 and 1.2. Empty: the pushed tag, if any.
      version: { type: string, default: "" }

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image != '' && inputs.image || format('ghcr.io/{0}', github.repository) }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
          flavor: |
            suffix=${{ inputs.suffix }},onlatest=true
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file != '' && inputs.file || format('{0}/Dockerfile', inputs.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per Dockerfile, so the CPU and GPU builds do not evict each other.
          cache-from: type=gha,scope=${{ inputs.suffix != '' && format('buildkit{0}', inputs.suffix) || 'buildkit' }}
          cache-to: type=gha,mode=max,scope=${{ inputs.suffix != '' && format('buildkit{0}', inputs.suffix) || 'buildkit' }}
