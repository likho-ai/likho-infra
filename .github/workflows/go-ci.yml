# Reusable CI for Go repositories (likho-media, likho-search).
# Caller:
#   jobs:
#     ci:
#       uses: likho-ai/likho-infra/.github/workflows/go-ci.yml@main
#       with:
#         stack-services: "postgres nats objectstore"   # optional: started from likho-infra before the tests
#         apt-packages: "ffmpeg"                         # optional: tools the tests call
name: go-ci

on:
  workflow_call:
    inputs:
      go-version-file: { type: string, default: "go.mod" }
      # Space-separated services of the likho-infra stack the tests need.
      # When set, LIKHO_REQUIRE_STACK=1 makes integration tests fail instead of being skipped.
      stack-services: { type: string, default: "" }
      apt-packages: { type: string, default: "" }

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        if: ${{ inputs.apt-packages != '' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}
      - name: Start services from likho-infra
        if: ${{ inputs.stack-services != '' }}
        run: |
          git clone --depth 1 https://github.com/likho-ai/likho-infra.git "$RUNNER_TEMP/likho-infra"
          cd "$RUNNER_TEMP/likho-infra"
          docker compose --profile infra up -d --wait ${{ inputs.stack-services }}
          case " ${{ inputs.stack-services }} " in *" nats "*) docker compose --profile infra --profile init run --rm init-nats ;; esac
          case " ${{ inputs.stack-services }} " in *" objectstore "*) docker compose --profile infra --profile init run --rm init-objectstore ;; esac
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Formatted with gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::not gofmt-formatted (run gofmt -w .):"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - run: go test -race ./...
        env:
          LIKHO_REQUIRE_STACK: ${{ inputs.stack-services != '' && '1' || '0' }}
      - run: go build ./...
