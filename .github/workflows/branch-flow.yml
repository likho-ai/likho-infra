# A pull request must follow the branch model, or this check fails (it is required on
# development, staging and main):
#
#   feature branches (feat/…, fix/…, …)  ->  development   (squash)
#   development                          ->  staging       (merge commit)
#   staging                              ->  main          (merge commit; main is production)
#   hotfix/…                             ->  main or staging, then back into development
#   main                                 ->  staging or development (back-merges after a release)
#   release-please--…                    ->  main          (the release pull request)
#
# It also checks that the title is a Conventional Commit (feat: …, fix: …).
#
# Reusable, and this repository's own check. Caller (.github/workflows/branch-flow.yml):
#   on: { pull_request: { branches: [main, staging, development], types: [opened, synchronize, reopened, edited] } }
#   jobs: { flow: { uses: likho-ai/likho-infra/.github/workflows/branch-flow.yml@main } }
name: branch-flow

on:
  workflow_call:
  pull_request:
    branches: [main, staging, development]
    types: [opened, synchronize, reopened, edited]

# The workflow's token reads the code and nothing more; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - name: The pull request goes the right way
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          ok=""
          case "$BASE" in
            main)
              case "$HEAD" in staging|hotfix/*|release-please--*) ok=1 ;; esac
              want="staging, hotfix/… or the release pull request" ;;
            staging)
              case "$HEAD" in development|main|hotfix/*) ok=1 ;; esac
              want="development (or main / hotfix/… for a back-merge)" ;;
            development)
              case "$HEAD" in staging) ok="" ;; *) ok=1 ;; esac
              want="a feature branch (feat/…, fix/…) or main for a back-merge" ;;
            *) ok=1 ;;
          esac
          if [ -z "$ok" ]; then
            echo "::error::$HEAD -> $BASE is not allowed. Into $BASE come: $want."
            echo "The way to production is feature -> development -> staging -> main (CONTRIBUTING.md)."
            exit 1
          fi
          echo "$HEAD -> $BASE: allowed"
      # A pull request into development is squash-merged: its title becomes the commit, and
      # release-please reads versions and the changelog from those titles.
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|refactor|perf|test|build|ci|chore|revert|style'
          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9._/-]+\))?!?: [^ ].*"; then
            echo "::error::The title '$TITLE' is not a Conventional Commit."
            echo "Write it as <type>: <what changed>, e.g. 'fix: the player keeps its place after a reload'."
            echo "Types: ${types//|/, }. A breaking change: 'feat!: …'. A scope: 'fix(search): …'."
            exit 1
          fi
          echo "title ok: $TITLE"
