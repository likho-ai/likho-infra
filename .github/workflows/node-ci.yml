# Reusable CI for TypeScript repositories (likho-api, web apps, likho-ui, likho-web-sdk).
# Caller:   jobs: { ci: { uses: likho-ai/likho-infra/.github/workflows/node-ci.yml@main } }
name: node-ci

on:
  workflow_call:
    inputs:
      node-version: { type: string, default: "24" }
      working-directory: { type: string, default: "." }
      run-build: { type: boolean, default: true }

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - if: ${{ inputs.run-build }}
        run: pnpm build
