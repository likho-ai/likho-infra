# Reusable CI for Python repositories (likho-transcription, likho-language).
# Caller:
#   jobs:
#     ci:
#       uses: likho-ai/likho-infra/.github/workflows/python-ci.yml@main
#       with:
#         stack-services: "postgres nats"     # optional: started from likho-infra before the tests
name: python-ci

on:
  workflow_call:
    inputs:
      python-version: { type: string, default: "3.12" }
      # Space-separated services of the likho-infra stack the tests need, for example "postgres nats".
      # When set, LIKHO_REQUIRE_STACK=1 makes integration tests fail instead of being skipped.
      stack-services: { type: string, default: "" }

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services from likho-infra
        if: ${{ inputs.stack-services != '' }}
        run: |
          git clone --depth 1 https://github.com/likho-ai/likho-infra.git "$RUNNER_TEMP/likho-infra"
          cd "$RUNNER_TEMP/likho-infra"
          docker compose --profile infra up -d --wait ${{ inputs.stack-services }}
          case " ${{ inputs.stack-services }} " in *" nats "*) docker compose --profile infra --profile init run --rm init-nats ;; esac
          case " ${{ inputs.stack-services }} " in *" objectstore "*) docker compose --profile infra --profile init run --rm init-objectstore ;; esac
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          LIKHO_REQUIRE_STACK: ${{ inputs.stack-services != '' && '1' || '0' }}
