name: ci

on:
  push:
    branches: [main, staging, development]
  pull_request:

# The workflow's token reads the code and nothing more; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  stack:
    name: Start the stack and run the smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile infra --profile obs config --quiet
      - name: Start
        run: bash scripts/up.sh
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose --profile infra logs --tail 80
